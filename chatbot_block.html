<!-- PICL-CHATBOT:START (v2.0) — self-contained; reads the dashboard's JSON data at runtime, so it needs no change when data refreshes -->
<style id="picl-bot-css">
:root{--pb-blue:#2f6fed;--pb-navy:#0b2545;--pb-cyan:#5ee1ff}
/* ---------- launcher: robot hiding in a parts box ---------- */
#pbFab{position:fixed;right:24px;bottom:58px;z-index:9000;width:56px;height:66px;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 8px 12px rgba(11,37,69,.35));transition:transform .2s}
#pbFab:hover{transform:translateY(-2px)}
#pbFab:focus-visible{outline:3px solid var(--pb-cyan);outline-offset:4px;border-radius:12px}
#pbBoxSvg{width:56px;height:66px;overflow:visible;display:block;transform-origin:50% 100%}
#pbFab:not(.peek) #pbBoxSvg{animation:pbWig 7s ease-in-out infinite}
@keyframes pbWig{0%,86%,100%{transform:none}89%{transform:rotate(-5deg)}92%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}98%{transform:rotate(2deg)}}
#pbRob{transform:translateY(34px);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#pbFL,#pbFR{transition:transform .3s ease}
#pbFL{transform-box:view-box;transform-origin:6px 44px}
#pbFR{transform-box:view-box;transform-origin:58px 44px}
#pbFab:hover:not(.peek) #pbFL{transform:rotate(-28deg)}#pbFab:hover:not(.peek) #pbFR{transform:rotate(28deg)}
#pbFab:hover:not(.peek) #pbRob{transform:translateY(22px)}
.pbWv{transform-box:view-box;transform-origin:45px 38px}
.pbEye{transform-box:fill-box;transform-origin:50% 50%;animation:pbBlink 4.4s infinite}
@keyframes pbBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pbAnt{animation:pbAnt 1.4s ease-in-out infinite}@keyframes pbAnt{0%,100%{opacity:1}50%{opacity:.3}}
#pbFab.peek #pbFL{animation:pbFl 7.2s ease-in-out both}
#pbFab.peek #pbFR{animation:pbFr 7.2s ease-in-out both}
#pbFab.peek #pbRob{animation:pbRise 7.2s ease-in-out both}
#pbFab.peek .pbWv{animation:pbWave .5s ease-in-out 1.7s 8 alternate both}
@keyframes pbFl{0%,2%{transform:none}10%,86%{transform:rotate(-80deg)}96%,100%{transform:none}}
@keyframes pbFr{0%,2%{transform:none}10%,86%{transform:rotate(80deg)}96%,100%{transform:none}}
@keyframes pbRise{0%,10%{transform:translateY(34px)}22%{transform:translateY(-3px)}27%,78%{transform:translateY(0)}90%,100%{transform:translateY(34px)}}
@keyframes pbWave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.pbBub{position:absolute;right:62px;bottom:34px;white-space:nowrap;background:linear-gradient(135deg,#0b2545,#2f6fed);color:#fff;font:700 13px/1 var(--font-body,Inter,sans-serif);padding:10px 14px;border-radius:14px 14px 3px 14px;box-shadow:0 8px 22px rgba(11,37,69,.35);border:1px solid rgba(255,255,255,.25);opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;transform-origin:100% 100%}
#pbFab.peek .pbBub{animation:pbBub 7.2s ease-in-out both}
@keyframes pbBub{0%,20%{opacity:0;transform:translateY(8px) scale(.9)}28%,76%{opacity:1;transform:none}86%,100%{opacity:0;transform:translateY(6px) scale(.92)}}
.pbHand{transform-origin:70% 85%}
.pbm .pbHand{width:19px;height:19px;vertical-align:-4px;color:var(--pb-blue);margin-right:4px;animation:pbWave .6s ease-in-out 2 alternate .3s both}
/* ---------- panel ---------- */
#pbPanel{position:fixed;right:22px;bottom:22px;z-index:9001;width:420px;max-width:calc(100vw - 24px);height:660px;max-height:calc(100vh - 44px);display:none;flex-direction:column;background:var(--panel,#fff);color:var(--text,#16233b);border:1px solid var(--border-hi,#c9d2df);border-radius:22px;box-shadow:0 24px 70px rgba(11,37,69,.38);overflow:hidden;font:13px/1.5 var(--font-body,Inter,sans-serif);transform-origin:100% 100%}
#pbPanel.open{display:flex;animation:pbIn .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pbIn{from{opacity:0;transform:translateY(16px) scale(.93)}to{opacity:1;transform:none}}
#pbPanel.wide{width:780px;height:calc(100vh - 44px)}
#pbHead{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;color:#fff;background:linear-gradient(135deg,#0b2545 0%,#123a7a 55%,#2f6fed 130%);position:relative}
#pbHead:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#5ee1ff,#2f6fed,#7c4dff)}
.pbAv{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
.pbAv svg{width:28px;height:28px;overflow:visible}
#pbHead .t{flex:1;min-width:0}
#pbHead .t b{display:block;font-size:15px;letter-spacing:.01em}
#pbHead .t span{display:flex;align-items:center;gap:6px;font-size:11px;opacity:.85}
#pbHead .t span:before{content:"";width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
#pbHead button{background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:30px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
#pbHead button:hover{background:rgba(255,255,255,.28)}
#pbHead button svg{width:15px;height:15px}
#pbMsgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;background:var(--bg,#eef1f5);scroll-behavior:smooth}
.pbm{max-width:94%;padding:11px 13px;border-radius:16px;word-wrap:break-word;animation:pbMsg .25s ease-out}
@keyframes pbMsg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pbm.u{align-self:flex-end;background:linear-gradient(135deg,#2f6fed,#4f46e5);color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 12px rgba(47,111,237,.3)}
.pbm.b{align-self:flex-start;background:var(--panel,#fff);border:1px solid var(--border,#e2e7ee);border-bottom-left-radius:4px;width:96%;box-shadow:0 2px 8px rgba(11,37,69,.06)}
.pbm.b p{margin:0 0 8px}.pbm.b p:last-child{margin-bottom:0}
.pbm .scope{display:inline-block;font-size:10.5px;font-weight:600;color:var(--pb-blue);background:var(--blue-dim,#e8f0fe);padding:3px 9px;border-radius:999px;margin-bottom:8px}
.pbm .note{font-size:11px;color:var(--text-dim,#5b6b83);margin-top:6px}
.pbm .warn{font-size:11.5px;background:var(--amber-dim,#fef2e2);color:var(--text,#16233b);border-left:3px solid var(--amber,#f5921f);padding:6px 9px;border-radius:6px;margin-top:8px}
.pbk{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:10px 0}
.pbk div{background:var(--panel-2,#f6f8fb);border:1px solid var(--border,#e2e7ee);border-radius:12px;padding:8px 10px;position:relative;overflow:hidden}
.pbk div:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border-hi,#c9d2df)}
.pbk div.good:before{background:var(--green,#1fa15a)}.pbk div.warn:before{background:var(--amber,#f5921f)}.pbk div.bad:before{background:var(--red,#e2483c)}
.pbk small{display:block;font-size:10px;color:var(--text-dim,#5b6b83);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.pbk b{font-size:17px;letter-spacing:-.01em}
.pbk i{display:block;font-style:normal;font-size:10.5px;color:var(--text-faint,#8a97ab)}
.pbt{overflow:auto;max-height:300px;border:1px solid var(--border,#e2e7ee);border-radius:12px;margin-top:8px}
.pbt table{border-collapse:collapse;width:100%;font-size:11.5px}
.pbt th{position:sticky;top:0;background:var(--panel-2,#f6f8fb);text-align:right;padding:7px 9px;font-weight:700;color:var(--text-dim,#5b6b83);white-space:nowrap;border-bottom:1px solid var(--border,#e2e7ee);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.pbt td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--border,#e2e7ee);white-space:nowrap}
.pbt tbody tr:nth-child(even) td{background:rgba(127,140,165,.06)}
.pbt tr:last-child td{border-bottom:0}
.pbt th:first-child,.pbt td:first-child{text-align:left;white-space:normal;min-width:96px}
.pbt tr.tot td{font-weight:700;background:var(--panel-2,#f6f8fb)!important}
.pbt td.bar{background-repeat:no-repeat;background-position:left center;background-size:var(--w,0%) 70%;background-image:linear-gradient(90deg,rgba(47,111,237,.22),rgba(47,111,237,.22))}
.pbc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pbc button{border:1px solid var(--border-hi,#c9d2df);background:var(--panel,#fff);color:var(--text,#16233b);border-radius:999px;padding:6px 11px;font:500 11.5px var(--font-body,Inter,sans-serif);cursor:pointer;transition:all .15s}
.pbc button:hover{border-color:var(--pb-blue);background:var(--pb-blue);color:#fff;transform:translateY(-1px)}
.pbc button.pbcopy{border:0;background:transparent;color:var(--text-faint,#8a97ab);padding:6px 4px}
.pbc button.pbcopy:hover{background:transparent;color:var(--pb-blue);transform:none}
.pbm details{margin-top:8px}.pbm summary{cursor:pointer;font-size:11.5px;color:var(--pb-blue)}
.pbm .ai ul{margin:4px 0 8px 18px;padding:0}
.pbtag{display:inline-block;font-size:10px;background:var(--blue-dim,#e8f0fe);color:var(--pb-blue);border-radius:999px;padding:1px 7px;margin-bottom:6px;font-weight:700}
#pbForm{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:6px 6px 6px 14px;background:var(--panel-2,#f6f8fb);border:1px solid var(--border-hi,#c9d2df);border-radius:999px;flex-shrink:0;transition:border-color .15s,box-shadow .15s}
#pbForm:focus-within{border-color:var(--pb-blue);box-shadow:0 0 0 3px rgba(47,111,237,.18)}
#pbIn{flex:1;min-width:0;border:0;background:transparent;color:var(--text,#16233b);padding:8px 0;font:13px var(--font-body,Inter,sans-serif);outline:none}
#pbSend{border:0;background:linear-gradient(135deg,#2f6fed,#4f46e5);color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
#pbSend:hover{transform:scale(1.08) rotate(-8deg)}
#pbSend svg{width:17px;height:17px}
.pbFoot{text-align:center;font-size:10px;color:var(--text-faint,#8a97ab);padding:0 12px 10px;flex-shrink:0}
.pbdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pb-blue);margin-right:4px;opacity:.35;animation:pbb 1s infinite}
.pbdot:nth-child(2){animation-delay:.15s}.pbdot:nth-child(3){animation-delay:.3s}
@keyframes pbb{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media(max-width:640px){#pbPanel,#pbPanel.wide{right:0;bottom:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}#pbFab{right:14px;bottom:12px}}
@media(prefers-reduced-motion:reduce){.pbRing,.pbSpark,#pbFab.peek .pbBot,#pbFab.peek .pbBot .pbWv,.pbm,#pbPanel.open{animation:none!important}}

.pbm .how{font-size:11.5px;margin-top:10px;border-top:1px dashed var(--border,#e2e7ee);padding-top:6px}.pbm .how p{margin:6px 0;color:var(--text-dim,#5b6b83)}
.pbt td.dg{color:var(--green,#1fa15a);font-weight:700}.pbt td.db{color:var(--red,#e2483c);font-weight:700}
.pbm ul{margin:4px 0 8px 18px;padding:0}.pbm li{margin:3px 0}
.pbHome{align-self:stretch;text-align:center;padding:6px 4px 2px}
.pbHome .big{width:64px;height:64px;margin:0 auto 8px;border-radius:20px;background:linear-gradient(135deg,#0b2545,#2f6fed);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(47,111,237,.35)}
.pbHome .big svg{width:42px;height:42px}
.pbHome h3{margin:0;font-size:18px;letter-spacing:-.01em}.pbHome p{margin:4px 0 12px;font-size:12px;color:var(--text-dim,#5b6b83)}
.pbCards{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.pbCards button{border:1px solid var(--border,#e2e7ee);background:var(--panel,#fff);color:var(--text,#16233b);border-radius:14px;padding:10px 11px;cursor:pointer;font:600 12px/1.3 var(--font-body,Inter,sans-serif);transition:all .15s;box-shadow:0 2px 6px rgba(11,37,69,.05)}
.pbCards button small{display:block;font-weight:400;font-size:10.5px;color:var(--text-dim,#5b6b83);margin-top:3px}
.pbCards button:hover{border-color:var(--pb-blue);transform:translateY(-2px);box-shadow:0 8px 18px rgba(47,111,237,.18)}
#pbQuick{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}#pbQuick::-webkit-scrollbar{display:none}
#pbQuick button{flex-shrink:0;border:1px solid var(--border-hi,#c9d2df);background:var(--panel,#fff);color:var(--text,#16233b);border-radius:999px;padding:5px 11px;font:600 11px var(--font-body,Inter,sans-serif);cursor:pointer}
#pbQuick button:hover{background:var(--pb-blue);border-color:var(--pb-blue);color:#fff}
#pbTA{display:none;margin:0 12px 6px;border:1px solid var(--border-hi,#c9d2df);border-radius:12px;background:var(--panel,#fff);box-shadow:0 8px 22px rgba(11,37,69,.15);overflow:hidden;flex-shrink:0}
#pbTA button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text,#16233b);padding:8px 12px;font:12px var(--font-body,Inter,sans-serif);cursor:pointer}#pbTA button:hover,#pbTA button.on{background:var(--blue-dim,#e8f0fe)}
#pbMic{border:0;background:transparent;color:var(--text-dim,#5b6b83);width:34px;height:34px;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative}
#pbMic svg{width:18px;height:18px}#pbMic:hover{background:var(--blue-dim,#e8f0fe);color:var(--pb-blue)}
#pbMic.on{background:#e2483c;color:#fff;animation:pbRec 1.1s infinite}
@keyframes pbRec{0%{box-shadow:0 0 0 0 rgba(226,72,60,.5)}100%{box-shadow:0 0 0 12px rgba(226,72,60,0)}}
#pbSpk.on{background:rgba(255,255,255,.35)}
#pbVoiceMsg{display:none;margin:0 14px 6px;font-size:11.5px;color:var(--pb-blue);font-weight:600;flex-shrink:0}
.pbch{width:100%;height:auto;margin:8px 0 2px;color:var(--text,#16233b);background:var(--panel-2,#f6f8fb);border:1px solid var(--border,#e2e7ee);border-radius:12px;padding:6px 8px;box-sizing:border-box}
.pbfb{display:flex;gap:2px;margin-left:auto}.pbfb button{border:0;background:transparent;cursor:pointer;color:var(--text-faint,#8a97ab);padding:4px 6px;border-radius:8px;display:flex}.pbfb button svg{width:14px;height:14px}.pbfb button:hover{color:var(--pb-blue);background:var(--blue-dim,#e8f0fe)}.pbfb button.on{color:#fff;background:var(--pb-blue)}
/* ---- v13 polish ---- */
#pbPanel{width:440px;height:700px;border-radius:26px;box-shadow:0 30px 80px rgba(8,22,48,.42),0 0 0 1px rgba(255,255,255,.06)}
#pbHead{padding:18px 16px 16px 18px;background:radial-gradient(120% 160% at 0% 0%,#2f6fed 0%,rgba(47,111,237,0) 55%),radial-gradient(90% 140% at 100% 100%,#7c4dff 0%,rgba(124,77,255,0) 60%),linear-gradient(135deg,#0b2545,#123a7a)}
.pbAv{position:relative;width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.16)}
.pbAv:after{content:"";position:absolute;inset:-4px;border-radius:19px;border:2px solid rgba(94,225,255,.45);animation:pbRing 2.6s ease-out infinite}
@keyframes pbRing{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
#pbHead .t b{font-size:17px;letter-spacing:.02em}
#pbHead .t span:before{background:#5ee1ff;box-shadow:0 0 0 3px rgba(94,225,255,.25)}
#pbMsgs{background:radial-gradient(60% 40% at 100% 0%,rgba(47,111,237,.07),transparent),radial-gradient(50% 40% at 0% 100%,rgba(124,77,255,.06),transparent),var(--bg,#eef1f5);gap:14px}
.pbrow{display:flex;gap:8px;align-items:flex-start}.pbrow.u{justify-content:flex-end}
.pbmini{width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#0b2545,#2f6fed);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;box-shadow:0 3px 8px rgba(47,111,237,.3)}
.pbmini svg{width:19px;height:19px}
.pbts{font-size:9.5px;color:var(--text-faint,#8a97ab);margin:3px 6px 0;display:block}.pbrow.u .pbts{text-align:right}
.pbm.b{border-radius:4px 18px 18px 18px;width:auto}.pbm.u{border-radius:18px 18px 4px 18px}
.pbSnap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.pbSnap div{background:var(--panel,#fff);border:1px solid var(--border,#e2e7ee);border-radius:14px;padding:9px 6px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(11,37,69,.06)}
.pbSnap div:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--border-hi,#c9d2df)}
.pbSnap .good:before{background:var(--green,#1fa15a)}.pbSnap .warn:before{background:var(--amber,#f5921f)}.pbSnap .bad:before{background:var(--red,#e2483c)}
.pbSnap b{display:block;font-size:18px;letter-spacing:-.02em}.pbSnap small{display:block;font-size:9.5px;color:var(--text-dim,#5b6b83);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:2px}
.pbHome .gr{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pb-blue);margin:0 0 2px}
.pbHome h3{font-size:21px}
.pbCards button{border-radius:16px;padding:12px}.pbCards .ic{display:flex;width:30px;height:30px;border-radius:9px;align-items:center;justify-content:center;background:var(--blue-dim,#e8f0fe);color:var(--pb-blue);margin-bottom:8px}.pbCards .ic svg{width:17px;height:17px}
#pbForm{border-radius:18px;padding:6px 6px 6px 16px}#pbSend{border-radius:13px}
@media(max-width:640px){#pbPanel,#pbPanel.wide{border-radius:0}}
/* ---- v16: logo launcher ---- */
#pbFab{width:58px;height:58px;filter:none}
#pbFab:hover{transform:translateY(-3px) scale(1.04)}
.pbBadge{position:relative;width:58px;height:58px;border-radius:19px;background:linear-gradient(150deg,#0a1f3d 0%,#123a7a 55%,#1f58c9 100%);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 24px -4px rgba(10,31,61,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.pbBadge svg{width:38px;height:38px;position:relative;z-index:1;overflow:visible}
.pbRing{position:absolute;inset:-5px;border-radius:23px;border:2px solid rgba(94,225,255,.5);animation:pbRing 2.8s ease-out infinite;pointer-events:none}
.pbSpark{transform-box:fill-box;transform-origin:50% 50%;animation:pbTw 3.2s ease-in-out infinite}
@keyframes pbTw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.35) rotate(45deg);opacity:.7}}
#pbFab.peek .pbBadge{animation:pbHop 1.2s ease-in-out 3}
@keyframes pbHop{0%,100%{transform:none}30%{transform:translateY(-9px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
/* robot pops out of the badge and says hii */
.pbBot{position:absolute;right:-2px;bottom:50px;width:66px;height:59px;z-index:0;pointer-events:none;opacity:0;transform:translateY(34px);transform-origin:50% 100%}
.pbBot svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 4px 6px rgba(10,31,61,.35))}
.pbBadge{z-index:1}
#pbFab.peek .pbBot{animation:pbBotUp 7.2s ease-in-out both}
@keyframes pbBotUp{0%,8%{opacity:0;transform:translateY(34px)}9%{opacity:1}22%{transform:translateY(-4px)}27%,78%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(34px)}91%,100%{opacity:0;transform:translateY(34px)}}
#pbFab.peek .pbBot .pbWv{animation:pbWave2 .45s ease-in-out 1.7s 9 alternate both}
@keyframes pbWave2{from{transform:rotate(-7deg)}to{transform:rotate(11deg)}}
.pbBot .pbWv{transform-box:view-box;transform-origin:52px 46px}
@keyframes pbWave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.pbWv{transform-box:view-box;transform-origin:45px 38px}
.pbEye{transform-box:fill-box;transform-origin:50% 50%;animation:pbBlink 4.4s infinite}
#pbFab.peek .pbBadge{animation:none}
/* optional real photo: window.NAVACHAR_AVATAR (data URI) puts a person's photo in the popup instead of the illustration */
.pbBot.photo{width:62px;height:62px;right:-2px;bottom:52px}
.pbBot.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 20px rgba(10,31,61,.45);display:block;background:#fff}

function topN(arr,keyf,n){return arr.slice().sort((x,y)=>keyf(y)-keyf(x)).slice(0,n);}

    if(L.length) h+='<li>Lines: '+L.map(x=>'<b>'+esc(x.k)+'</b> −'+n0(x.m.gap)+' ('+pct(x.m.ach)+')').join('; ')+'</li>';

    items.push(['achievement',h]); }
  // OEE drivers

    rows.forEach(r=>(r.lossDetails||[]).forEach(l=>{const k=l.reason||'?';by.set(k,(by.get(k)||0)+(l.manhr||0));tot+=l.manhr||0;const rm=cleanRem(l.remark);if(rm)byR.set(rm,(byR.get(rm)||0)+(l.manhr||0));}));

    let h='<p><b>Rejections</b> — '+n0(m.rej)+' units'+(m.rejRate!=null?' ('+pct(m.rejRate)+')':'')+'</p>';
    if(R.length||W.length){h+='<ul>'+(R.length?'<li>Top reasons: '+R.map(([k,v])=>'<b>'+esc(k)+'</b> '+n0(v)+' ('+n1(v/tot*100)+'%)').join('; ')+'</li>':'')+(W.length?'<li>Most rejects on: '+W.map(x=>'<b>'+esc(x.k)+'</b> '+n0(x.m.rej)+' ('+pct(x.m.rejRate)+')').join('; ')+'</li>':'')+'</ul>';} else h+='<p class="note">No rejections logged.</p>';

function groupMetrics(rows,g,p){const map=new Map();rows.forEach(r=>{const k=groupKey(r,g,p);(map.get(k)||map.set(k,[]).get(k)).push(r);});return [...map.entries()].map(([k,rs])=>({k,m:metrics(rs)}));}

function distinctAnswer(p){

function searchAnswer(p){

    console.error('PICL AI error',e); typing.remove();
    let res; try{res=answer(applyFollowUp(parse(text)));}catch(_){res={html:'<p>Sorry, something went wrong.</p>',chips:SUGGEST};}
    const why=e.status===401?'The API key was rejected (check ⚙ settings).':e.status===429?'The AI service is rate-limited right now.':'Could not reach the AI service ('+esc(e.message.slice(0,120))+').';
    res.html='<div class="warn">'+why+' Showing a basic answer instead.</div>'+res.html; addBot(res);
  }
}

setSub();refreshMode();welcome();restoreChat();

window.piclBotAsk=ask; // handy for testing: piclBotAsk('PSC summary')
})();
